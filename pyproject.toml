[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aima-story-director"
version = "1.0.0"
description = "Offline, auditable robot-show script validation and dry-run rehearsal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
aima-director = "aima_director.__main__:main"

[tool.setuptools.packages.find]
include = ["aima_director*"]
