<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 435" role="img" aria-labelledby="title desc">
<title id="title">展览导览：一件展品的两种讲法 — dry-run timeline</title>
<desc id="desc">Simulated speech, gestures, waits and event decisions across 25 seconds. No hardware commands were sent.</desc>
