<g><title>intro:introduce | 0–7000 ms | 欢迎来到未来城市展台。眼前的节水模型，把一次普通的洗手，变成了一段可以观察的水循环。</title><rect x="135" y="115" width="257.6" height="30" rx="4" fill="#69d7c5" opacity=".85"/>
<text x="142" y="135" font-size="11" fill="#101a29">intro:introduce</text>
</g>
<g><title>intro:present | 800–4300 ms | open-arms · amplitude 0.3 · speed 0.25</title><rect x="164.44" y="185" width="128.8" height="30" rx="4" fill="#e8b56b" opacity=".85"/>
<text x="171.44" y="205" font-size="11" fill="#101a29">intro:present</text>
</g>
